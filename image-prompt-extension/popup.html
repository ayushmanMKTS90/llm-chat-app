<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Prompt Generator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <h1>Image Prompt Generator</h1>
      <p class="subtitle">NVIDIA NIM - Style presets</p>
    </header>

    <section class="api-section">
      <h2>NVIDIA API Key</h2>
      <p class="hint">Get your free key at <a href="https://build.nvidia.com" target="_blank">build.nvidia.com</a></p>
      <div class="input-group">
        <input type="password" id="apiKey" placeholder="nvapi-..." autocomplete="off">
        <button id="saveApiKey">Save</button>
      </div>
      <p id="apiStatus" class="status"></p>
    </section>

    <section class="style-section">
      <h2>Prompt Style</h2>
      <p class="hint">Templates optimized for different art styles</p>
      <select id="styleSelect">
        <option value="photorealistic">📷 Photorealistic</option>
        <option value="cinematic">🎬 Cinematic / Film</option>
        <option value="anime">🎨 Anime / Manga</option>
        <option value="oilpainting">🖼 Oil Painting</option>
        <option value="digitalart">💻 Digital Art / Concept</option>
        <option value="minimalist">◻ Minimalist / Vector</option>
      </select>
    </section>

    <section class="debug-section">
      <button id="testApi" class="test-btn">Test API Connection</button>
      <p id="testResult" class="test-result"></p>
    </section>

    <section class="prompts-section">
      <div class="section-header">
        <h2>Saved Prompts</h2>
        <button id="clearAll" class="clear-btn">Clear All</button>
      </div>
      <div id="savedPrompts"></div>
    </section>

    <footer>
      <p>Right-click any image → "Generate Prompt for This Image"</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
